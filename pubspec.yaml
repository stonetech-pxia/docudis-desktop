name: docudis
description: "Docudis: free, on-device document anonymization."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  archive: ^4.3.0
  desktop_drop: ^0.8.0
  docudis_ffi:
    git:
      url: https://github.com/stonetech-pxia/docudis-core.git
      ref: 73a65b3047bf37678b427d235081ca899f924260
      path: bindings/dart
  docudis_ner_ffi:
    git:
      url: https://github.com/stonetech-pxia/docudis-ner.git
      ref: 6badf8e2d2eeea97341c6fedbab5d432b50f59d0
      path: bindings/dart
  docudis_pdf:
    path: packages/docudis_pdf
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.6.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora[wght].ttf
    - family: Karla
      fonts:
        - asset: assets/fonts/Karla[wght].ttf
        - asset: assets/fonts/Karla-Italic[wght].ttf
          style: italic
