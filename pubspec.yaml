name: docudis
description: "Docudis: free, on-device document anonymization."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora[wght].ttf
    - family: Karla
      fonts:
        - asset: assets/fonts/Karla[wght].ttf
        - asset: assets/fonts/Karla-Italic[wght].ttf
          style: italic
