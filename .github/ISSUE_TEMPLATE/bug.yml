name: Bug
description: Something does not work, crashes or looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach real documents or screenshots that show personal data.** Issues are public; use made-up content.
        A security problem (for example content leaving the computer) goes in a [private report](https://github.com/stonetech-pxia/docudis-desktop/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Docudis version and system
      placeholder: 0.1.0, Windows 11
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: File type, error message, steps that always reproduce it.
