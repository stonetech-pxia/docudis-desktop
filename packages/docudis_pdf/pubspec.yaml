name: docudis_pdf
description: Removes text from a PDF's content streams and writes replacement labels (pure Dart, PDFium via pdfrx).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.3

dependencies:
  ffi: ^2.2.0
  pdfium_dart: ^0.3.0
  pdfrx_engine: ^0.6.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
